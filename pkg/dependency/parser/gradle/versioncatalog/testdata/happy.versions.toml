[versions]
junit = "4.13.2"
guava = { strictly = "32.1.3-jre" }
mockito = { require = "5.5.0", prefer = "5.6.0" }
springBoot = "3.2.4"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
commons-lang3 = "org.apache.commons:commons-lang3:3.14.0"
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.9" }
rich = { module = "com.example:rich", version = { require = "1.0", prefer = "1.1" } }
strict = { module = "com.example:strict", version = { strictly = "2.0", require = "1.9" } }
no-version = { module = "com.example:no-version" }

[bundles]
testing = ["junit", "mockito-core"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "1.9.23" }
spring = { id = "org.springframework.boot", version.ref = "springBoot" }
